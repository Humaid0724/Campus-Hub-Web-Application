  <main class="main">

    <section class="lf-header">
      <div>
        <h1 class="lf-title" id="page-title">Events</h1>
        <p class="lf-subtitle" id="page-subtitle">...</p>
      </div>

      <button class="lf-report-btn" id="create-event-btn" style="display: none;">
        + Create Event
      </button>
    </section>

    
    <div id="events-content-area">
      </div>

<div id="eventModal" class="modal hidden">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        
        <label><h2> Create New Event </h2> </label>
       <label><h6> <i>  Add a new campus event for students </h6> </label>
<br>
            <form id="eventForm">
            <input type="text" size="50" id="eventTitle" required placeholder="Event Title">
<br>  
</br>
            <textarea rows="3" cols="52" placeholder="Description" id="eventDescription" required></textarea>
<br>  

            <label>Start Date & Time:</label><br>
            <input type="date" id="eventStartDate" required>
            <input type="time" id="eventStartTime" required>
<br>  
</br>
            <label>End Date & Time:</label><br>
            <input type="date" id="eventEndDate" required>
            <input type="time" id="eventEndTime" required>
<br>  
<br>
            <select name="subjects" id="subjects">
              <option value="choose">*Choose an Education Department*</option>
              <option value="macs">MACS</option>
              <option value="gcd">Global College Dubai</option>
              <option value="egis">Energy, Geoscience, infrastructure and Society</option>
              <option value="eps">Engineering and Physical Sciences</option>
              <option value="soss">School of Social Sciences</option>
              <option value="ebsd">Edinburgh Business School - Dubai</option>
              <option value="t&d">Textiles and Designs</option>
              <option value="other">Other</option>
              </select>
<br>
</br>
            <input type="text" pattern="\d\.\d{2}" placeholder="Room Number (e.g., 5.35)" id="roomNo" required>
<br>  

</br>
            <button type="submit" class="finalise-event-btn">Create Event</button>
        </form>
    </div>
</div>

<script src="../scripts/script.js"></script>
<script src="../scripts/events.js"></script> </body>
</html>
