              <li>

              </li>
              <li>
                <a href="./calendar.html"

            <div>Name</div>
            <div>Email</div>
            <div>Department</div>
            <div>Role</div>
            <div style="text-align: right">Actions</div>
          </div>

            <li class="roster-empty-text">Loading user roster...</li>
