<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile - Campus Hub</title>
    <link rel="stylesheet" href="../styles/profile.css" />
  </head>
  <body>
    <div class="container">
      <h1>Your Profile</h1>
      <p>View and update your academic and personal details.</p>

      <form id="profileForm">
        <div class="profile-card">
          <h2>Personal Details</h2>
          <div class="form-group-split">
            <div class="form-group">
              <label for="first_name">First Name</label>
              <input type="text" id="first_name" required disabled />
            </div>
            <div class="form-group">
              <label for="last_name">Last Name</label>
              <input type="text" id="last_name" required disabled />
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" disabled />
            <small>Email address cannot be changed.</small>
          </div>
        </div>

        <div class="profile-card">
          <h2>Academic Details</h2>
          <div class="form-group">
            <label for="department">School/Department</label>
            <select id="department" required disabled>
              <option value="" disabled>Select your school</option>
              <option value="Global College Dubai">Global College Dubai</option>
              <option value="Energy, Geoscience, Infrastructure and Society">
                Energy, Geoscience, Infrastructure and Society
              </option>
              <option value="Engineering and Physical Sciences">
                Engineering and Physical Sciences
              </option>
              <option value="Mathematical and Computer Sciences">
                Mathematical and Computer Sciences
              </option>
              <option value="School of Social Sciences">
                School of Social Sciences
              </option>
              <option value="Edinburgh Business School - Dubai">
                Edinburgh Business School - Dubai
              </option>
              <option value="Textiles and Design">Textiles and Design</option>
            </select>
          </div>
          <div class="form-group-split">
            <div class="form-group">
              <label for="campus">Campus</label>
              <input type="text" id="campus" required disabled />
            </div>
            <div class="form-group">
              <label for="study_year">Year of Study</label>
              <input
                type="number"
                id="study_year"
                min="1"
                max="5"
                required
                disabled
              />
            </div>
          </div>
          <div class="form-group">
            <label for="major">Major (e.g., Software Engineering)</label>
            <input type="text" id="major" required disabled />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="edit-profile-btn" class="submit-btn">
            Edit Profile
          </button>
          <button
            type="submit"
            id="save-changes-btn"
            class="submit-btn"
            style="display: none"
          >
            Save Changes
          </button>
          <button
            type="button"
            id="cancel-edit-btn"
            class="submit-btn secondary-btn"
            style="display: none"
          >
            Cancel
          </button>

          <button type="button" id="home-btn" class="submit-btn secondary-btn">
            Return to Home
          </button>

          <p id="message"></p>
        </div>
      </form>
    </div>
    <script src="../scripts/profile.js"></script>
  </body>
</html>
